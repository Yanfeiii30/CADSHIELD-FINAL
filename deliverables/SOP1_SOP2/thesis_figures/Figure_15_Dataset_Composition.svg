<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 44px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #64748b; }
    .axis { font-size: 19px; fill: #64748b; }
    .label { font-size: 22px; font-weight: 600; }
    .value { font-size: 22px; font-weight: 700; }
    .small { font-size: 17px; fill: #64748b; }
  </style>
  <text x="90" y="82" class="title">Dataset Composition</text>
  <text x="90" y="122" class="subtitle">Distribution of aggressive and non-aggressive comments in the complete dataset</text>
  
    <rect x="90" y="175" width="1420" height="700" rx="28" fill="#f8fafc" stroke="#dbe3ee" stroke-width="2"/>
    <circle cx="500" cy="525" r="220" fill="none" stroke="#2563eb" stroke-width="92"/>
    <circle cx="500" cy="525" r="220" fill="none" stroke="#d97706" stroke-width="92"
      stroke-dasharray="345.57519189487726 1036.7255756846318" transform="rotate(-90 500 525)"/>
    <circle cx="500" cy="525" r="142" fill="#ffffff"/>
    <text x="500" y="510" text-anchor="middle" style="font-size:54px;font-weight:700">64,900</text>
    <text x="500" y="552" text-anchor="middle" class="subtitle">total comments</text>
    <rect x="870" y="355" width="36" height="36" rx="7" fill="#2563eb"/>
    <text x="930" y="383" class="label">Non-aggressive</text>
    <text x="930" y="438" style="font-size:44px;font-weight:700">48,675</text>
    <text x="930" y="476" class="subtitle">75% of the dataset</text>
    <rect x="870" y="575" width="36" height="36" rx="7" fill="#d97706"/>
    <text x="930" y="603" class="label">Aggressive</text>
    <text x="930" y="658" style="font-size:44px;font-weight:700">16,225</text>
    <text x="930" y="696" class="subtitle">25% of the dataset</text>
    <text x="870" y="790" class="small">Class ratio: 3 non-aggressive comments for every 1 aggressive comment</text>
  <line x1="90" y1="935" x2="1510" y2="935" stroke="#dbe3ee" stroke-width="2"/>
  <text x="90" y="972" class="small">Source: TRAINING/data/dataset.csv</text>
</svg>